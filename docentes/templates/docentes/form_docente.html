{% extends "base.html" %}
{% block title %}{% if modo == 'editar' %}Editar Docente{% else %}Nuevo Docente{% endif %}{% endblock %}
{% block content %}
<h1 class="mb-4">{% if modo == 'editar' %}Editar Docente{% else %}Nuevo Docente{% endif %}</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Guardar</button>
    <a href="{% url 'docentes:index' %}" class="btn btn-secondary">Volver</a>
</form>
{% endblock %}
